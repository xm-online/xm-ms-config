# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

# See https://github.com/Netflix/Hystrix/wiki/Configuration
#hystrix:
#    command:
#        default:
#            execution:
#                isolation:
#                    thread:
#                        timeoutInMilliseconds: 10000

management:
    tracing:
        export:
            enabled: ${MANAGEMENT_TRACING_EXPORT_ENABLED:false}
    otlp:
        metrics:
            export:
                enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
    endpoints:
        web:
            base-path: /management
            exposure:
                include:
                    - configprops
                    - env
                    - health
                    - info
                    - threaddump
                    - logfile
                    - jhimetrics
                    - prometheus
    endpoint:
        health:
            show-details: when_authorized
            probes:
                enabled: true
            group:
                liveness:
                    include: livenessState
                readiness:
                    include: readinessState
        jhimetrics:
            enabled: true
    info:
        git:
            mode: full
    health:
        mail:
            enabled: false
    prometheus:
        metrics:
            export:
                enabled: true
                step: 60
    metrics:
        enable:
            http: true
            jvm: true
            logback: true
            process: true
            system: true
        distribution:
            percentiles-histogram:
                all: true
            percentiles:
                all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
        tags:
            application: ${spring.application.name}

spring:
    application:
        name: config
    main:
        allow-bean-definition-overriding: true
        web-application-type: servlet
    cloud:
        consul:
            enabled: true
            discovery:
                query-passing: true
                healthCheckPath: /management/health
                instanceId: ${spring.application.name}:${spring.application.instance-id:${random.value}}
                service-name: ${spring.application.name}
            config:
                watch:
                    enabled: false

    jackson:
        deserialization:
            fail-on-trailing-tokens: false
        mapper:
            sort-properties-alphabetically: false
        serialization:
            indent-output: true
    messages:
        basename: i18n/messages
    thymeleaf:
        mode: HTML
    kafka:
        consumer:
            group-id: ${spring.application.name}
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        listener:
            concurrency: 16
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
        properties:
            security.protocol: PLAINTEXT # SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SASL_PLAINTEXT, protocol to the brokers: PLAINTEXT, SASL_PLAINTEXT, SSL, SASL_SSL; empty is not allowed
            sasl.mechanism: # SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=SCRAM-SHA-512, SASL mechanism: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
            sasl.jaas.config: # SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG=org.apache.kafka.common.security.scram.ScramLoginModule required username="user" password="secret";, SASL login and password
            # ssl.endpoint.identification.algorithm: # SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=https, check of the broker host name in its certificate, https when not set; empty switches the check off
            # OAUTHBEARER (SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=OAUTHBEARER, SASL_JAAS_CONFIG with org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="id" clientSecret="secret";):
            sasl.oauthbearer.token.endpoint.url: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL=https://idp/oauth/token, where the client gets the token
            sasl.oauthbearer.jwks.endpoint.url: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL=https://idp/oauth/jwks, keys to validate the token, when the client validates it
            # sasl.oauthbearer.scope.claim.name: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_SCOPE_CLAIM_NAME=scope, claim of the scope in the token, scope when not set
            # sasl.oauthbearer.sub.claim.name: # SPRING_KAFKA_PROPERTIES_SASL_OAUTHBEARER_SUB_CLAIM_NAME=sub, claim of the principal in the token, sub when not set
            # sasl.login.callback.handler.class: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_CALLBACK_HANDLER_CLASS=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler, gets the token for OAUTHBEARER
            # sasl.client.callback.handler.class: # SPRING_KAFKA_PROPERTIES_SASL_CLIENT_CALLBACK_HANDLER_CLASS=com.example.CustomClientCallbackHandler, custom SASL client callback handler
            # sasl.login.class: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_CLASS=org.apache.kafka.common.security.oauthbearer.internals.OAuthBearerRefreshingLogin, custom login class
            # sasl.login.connect.timeout.ms: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_CONNECT_TIMEOUT_MS=10000, connect timeout to the token endpoint
            # sasl.login.read.timeout.ms: # SPRING_KAFKA_PROPERTIES_SASL_LOGIN_READ_TIMEOUT_MS=10000, read timeout from the token endpoint
            # GSSAPI (SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=GSSAPI, SASL_JAAS_CONFIG with com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true keyTab="/etc/kafka.keytab" principal="config@REALM";):
            sasl.kerberos.service.name: # SPRING_KAFKA_PROPERTIES_SASL_KERBEROS_SERVICE_NAME=kafka, Kerberos principal name of the broker
        ssl: # the commented out properties break SSL when empty, set them by the environment variables when needed
            trust-store-location: # SPRING_KAFKA_SSL_TRUST_STORE_LOCATION=file:/certs/ca.p12, CA of the broker certificate, for SSL and SASL_SSL
            # trust-store-password: # SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD=changeit, password of the trust store
            trust-store-type: # SPRING_KAFKA_SSL_TRUST_STORE_TYPE=PKCS12, type of the trust store: PKCS12, JKS, PEM
            key-store-location: # SPRING_KAFKA_SSL_KEY_STORE_LOCATION=file:/certs/config.p12, client certificate, for SSL and SASL_SSL
            # key-store-password: # SPRING_KAFKA_SSL_KEY_STORE_PASSWORD=changeit, password of the key store file
            key-store-type: # SPRING_KAFKA_SSL_KEY_STORE_TYPE=PKCS12, type of the key store: PKCS12, JKS, PEM
            # key-password: # SPRING_KAFKA_SSL_KEY_PASSWORD=changeit, password of the private key, when it differs from the key store password
            # protocol: # SPRING_KAFKA_SSL_PROTOCOL=TLSv1.3, TLS protocol, Kafka default when not set
            bundle: # SPRING_KAFKA_SSL_BUNDLE=kafka, name of a spring.ssl.bundle instead of the key store and trust store above
            # PEM instead of the store files above:
            # key-store-certificate-chain: # SPRING_KAFKA_SSL_KEY_STORE_CERTIFICATE_CHAIN=-----BEGIN CERTIFICATE-----..., client certificate chain in PEM, with SPRING_KAFKA_SSL_KEY_STORE_TYPE=PEM
            # key-store-key: # SPRING_KAFKA_SSL_KEY_STORE_KEY=-----BEGIN PRIVATE KEY-----..., client private key in PEM, with SPRING_KAFKA_SSL_KEY_STORE_TYPE=PEM
            # trust-store-certificates: # SPRING_KAFKA_SSL_TRUST_STORE_CERTIFICATES=-----BEGIN CERTIFICATE-----..., CA certificates in PEM, with SPRING_KAFKA_SSL_TRUST_STORE_TYPE=PEM
    # the bundle of spring.kafka.ssl.bundle, SPRING_SSL_BUNDLE_JKS_KAFKA_*; empty values break the bundle, set them by the environment variables when needed:
    # ssl:
    #     bundle.jks.kafka.truststore.location: # SPRING_SSL_BUNDLE_JKS_KAFKA_TRUSTSTORE_LOCATION=file:/certs/ca.p12, CA of the broker certificate
    #     bundle.jks.kafka.truststore.password: # SPRING_SSL_BUNDLE_JKS_KAFKA_TRUSTSTORE_PASSWORD=changeit, password of the trust store
    #     bundle.jks.kafka.truststore.type: # SPRING_SSL_BUNDLE_JKS_KAFKA_TRUSTSTORE_TYPE=PKCS12, type of the trust store
    #     bundle.jks.kafka.keystore.location: # SPRING_SSL_BUNDLE_JKS_KAFKA_KEYSTORE_LOCATION=file:/certs/config.p12, client certificate
    #     bundle.jks.kafka.keystore.password: # SPRING_SSL_BUNDLE_JKS_KAFKA_KEYSTORE_PASSWORD=changeit, password of the key store
    #     bundle.jks.kafka.keystore.type: # SPRING_SSL_BUNDLE_JKS_KAFKA_KEYSTORE_TYPE=PKCS12, type of the key store
    servlet:
        multipart:
            max-file-size: 50MB
            max-request-size: 50MB

server:
    servlet:
        session:
            cookie:
                http-only: true

# Properties to be exposed on the /info management endpoint
info:
    # Comma separated list of profiles that will trigger the ribbon to show
    display-ribbon-on-profiles: "dev"
# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
    clientApp:
        name: 'configurationApp'
    api-docs:
        default-include-pattern: ${server.servlet.context-path:}/api/**
        management-include-pattern: ${server.servlet.context-path:}/management/**
        title: Configuration API
        description: Configuration API documentation
    security:
        content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://storage.googleapis.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:"


# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================
xm-config.enabled: true
xm-config:
    configMode: OWNER
    xm-config-url: http://config
    kafka-config-topic: config_topic
    kafka-config-queue: config_queue

tenant.reject-suspended: false

application:
    adminApiRestrictionEnabled: false
    # Base64 Ed25519 public key (X.509 DER) for /api/private/v2.
    # The services sign the token with the private key application.config-private-key.
    config-public-key:
    super-tenants-list: XM, MANAGER
    tenant-ignored-path-list: /api/token_key, /api/private/config_map, /api/private/config_map/pattern, /api/private/v2/config_map, /api/private/v2/config_map/pattern, /v3/api-docs
    kafka-enabled: true
    kafka-system-queue: system_queue
    kafka-in-memory-config-topic: in_memory_config_topic
    kafka-metadata-max-age: 60000 #in milliseconds
    versionCacheMaxSize: 100
    update-config-available: true
    update-config-in-memory-available: true
    retry:
        max-attempts: 3
        delay: 10000 #in milliseconds
        multiplier: 2
    config-queue-retry:
        max-attempts: 3
        delay: 10000 #in milliseconds
        multiplier: 2
    env-config-externalization-enabled: false
    lep:
        tenant-script-storage: XM_MS_CONFIG
        processor-enabled: false
    env-externalization-blacklist:
        - APPLICATION_GIT_SSH_PASS_PHRASE
        - APPLICATION_GIT_PASSWORD
        - APPLICATION_GIT_PRIVATE_KEY
    git:
      ssh:
          accept-unknown-host: true
    config-repository:
        mode: GIT # GIT, S3, DYNAMIC, FILE
#    Uncomment for configure FILE repository supporting
#        file:
#            path: /etc/xm-config        # directory that CONTAINS the `config` folder
#            debounce-time: 2            # seconds to batch filesystem change events
#            read-only: false            # true if the folder is managed externally (writes rejected)
#    Uncomment for configure S3 repository supporting
#        s3:
#            endpoint: http://localhost:9000
#            accessKey: ${S3_ACCESS_KEY}
#            secretKey: ${S3_SECRET_KEY}
#            region: eu-central-1
#            bucket: xm-config
#            config-path: xm-config # Required to save config files in a subdirectory instead of the bucket root
#            path-style-access: true # Required for Minio
#            rules:
#                include-paths:
#                    - /config/tenants/*
#                    - /config/global/*
#                exclude-paths:
#                    - /config/legacy/*
gracefulShutdown:
    enabled: false
    shutdownDelay:
